<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1813" />
      <stop offset="100%" stop-color="#0e0a08" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Moroccan Octagram Geometric Star -->
  <g transform="translate(200, 110) scale(0.65)" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <rect x="-35" y="-35" width="70" height="70" rx="4" />
    <rect x="-35" y="-35" width="70" height="70" rx="4" transform="rotate(45)" />
    <!-- Grill Flame in the center of Star -->
    <path d="M0,20 C-15,10 -15,-10 0,-25 C15,-10 15,10 0,20 Z" fill="url(#flameGrad)" stroke="none" />
    <path d="M0,15 C-8,8 -8,-2 0,-12 C8,-2 8,8 0,15 Z" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Circular Arch Text Simulation or Top Banner -->
  <text x="200" y="70" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="12" fill="#d97706" letter-spacing="4" font-weight="600">
    BRASSERIE &amp; GRILLADES
  </text>

  <!-- Main Name: BELANFA -->
  <text x="200" y="210" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="46" font-weight="bold" fill="url(#goldGrad)" letter-spacing="6">
    BELANFA
  </text>

  <!-- Subtitle -->
  <text x="200" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fef3c7" letter-spacing="5" font-weight="600">
    RESTAURANT
  </text>

  <!-- Divider with decorative diamonds -->
  <line x1="80" y1="260" x2="160" y2="260" stroke="#78350f" stroke-width="1.5" />
  <polygon points="200,256 204,260 200,264 196,260" fill="#d97706" />
  <polygon points="185,258 188,260 185,262 182,260" fill="#78350f" />
  <polygon points="215,258 218,260 215,262 212,260" fill="#78350f" />
  <line x1="240" y1="260" x2="320" y2="260" stroke="#78350f" stroke-width="1.5" />

  <!-- Address & City -->
  <text x="200" y="285" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#f59e0b" letter-spacing="3" font-weight="500">
    CASABLANCA
  </text>

  <text x="200" y="310" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a8a29e" letter-spacing="2">
    26 RUE DRISS LAHRIZI
  </text>

  <!-- Bottom established date -->
  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f" letter-spacing="3">
    ★ DEPUIS 1998 ★
  </text>
</svg>
